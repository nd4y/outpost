rule_files:
  - outpost.rules.yml
  - watchdog.rules.yml
evaluation_interval: 1m

tests:
  - name: Original observation times distinguish current failures and missing telemetry
    start_timestamp: 1000
    interval: 1m
    input_series:
      - series: 'outpost_expected_telemetry_max_age_seconds{outpost_node="node",outpost_domain="domain"}'
        values: "120+0x8"
      - series: 'outpost_expected_free_bytes{outpost_node="node",outpost_domain="domain"}'
        values: "10+0x8"
      - series: 'outpost_expected_copy_max_age_seconds{outpost_node="node",outpost_domain="domain",outpost_target="node"}'
        values: "90+0x8"
      - series: 'outpost_report_observed_timestamp_seconds{outpost_node="node",outpost_domain="domain"}'
        values: "1000 1060 _ _ _ 1300 1360 1600 1480"
      - series: 'outpost_inventory_available{outpost_node="node",outpost_domain="domain"}'
        values: "1 1 _ _ _ 0 1 1 1"
      - series: 'outpost_jobs_blocked{outpost_node="node",outpost_domain="domain"}'
        values: "0 2 _ _ _ 0 0 0 0"
      - series: 'outpost_space_free_bytes{outpost_node="node",outpost_domain="domain"}'
        values: "20 5 _ _ _ _ 20 20 20"
      - series: 'outpost_space_free_bytes_known{outpost_node="node",outpost_domain="domain"}'
        values: "1 1 _ _ _ 0 1 1 1"
      - series: 'outpost_copy_verified_timestamp_seconds{outpost_node="node",outpost_domain="domain",outpost_target="node"}'
        values: "985 1060 _ _ _ _ 1350 1600 1470"
      - series: 'outpost_copy_verified_timestamp_seconds_known{outpost_node="node",outpost_domain="domain",outpost_target="node"}'
        values: "1 1 _ _ _ 0 1 1 1"
      - series: 'outpost_external_audit_result{outpost_node="node",outpost_domain="domain",outpost_target="external"}'
        values: "1 3 _ _ _ _ 1 _ 1"
      - series: 'outpost_external_audit_result_known{outpost_node="node",outpost_domain="domain",outpost_target="external"}'
        values: "1 1 _ _ _ 0 1 _ 1"
      - series: 'outpost_external_audit_expires_timestamp_seconds{outpost_node="node",outpost_domain="domain",outpost_target="external"}'
        values: "1060 1120 _ _ _ _ 1420 _ 1540"
    alert_rule_test:
      - eval_time: 0m
        alertname: OutpostTelemetryMissing
        exp_alerts: []
      - eval_time: 1m
        alertname: OutpostJobsBlocked
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: blocked-jobs }
      - eval_time: 2m
        alertname: OutpostJobsBlocked
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: blocked-jobs }
      - eval_time: 1m
        alertname: OutpostSpaceLow
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: capacity }
      - eval_time: 1m
        alertname: OutpostExternalAuditFailed
        exp_alerts:
          - exp_labels:
              {
                outpost_node: node,
                outpost_domain: domain,
                outpost_target: external,
                severity: warning,
              }
            exp_annotations: { runbook: integrity }
      - eval_time: 2m
        alertname: OutpostExternalAuditFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: OutpostReplicaVerificationOverdue
        exp_alerts:
          - exp_labels:
              {
                outpost_node: node,
                outpost_domain: domain,
                outpost_target: node,
                severity: warning,
              }
            exp_annotations: { runbook: recovery }
      - eval_time: 4m
        alertname: OutpostTelemetryMissing
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: connectivity }
      - eval_time: 4m
        alertname: OutpostJobsBlocked
        exp_alerts: []
      - eval_time: 5m
        alertname: OutpostTelemetryMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: OutpostInventoryUnknown
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: connectivity }
      - eval_time: 5m
        alertname: OutpostSpaceLow
        exp_alerts: []
      - eval_time: 5m
        alertname: OutpostSpaceUnknown
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: capacity }
      - eval_time: 6m
        alertname: OutpostSpaceUnknown
        exp_alerts: []
      - eval_time: 6m
        alertname: OutpostReplicaVerificationOverdue
        exp_alerts: []
      - eval_time: 7m
        alertname: OutpostTelemetryMissing
        exp_alerts:
          - exp_labels: { outpost_node: node, outpost_domain: domain, severity: warning }
            exp_annotations: { runbook: connectivity }
      - eval_time: 8m
        alertname: OutpostTelemetryMissing
        exp_alerts: []

  - name: The independent watchdog ages the receiver heartbeat even without primary metrics
    start_timestamp: 1000
    interval: 1m
    input_series:
      - series: 'outpost_expected_monitor_max_age_seconds{outpost_monitor="primary"}'
        values: "90+0x6"
      - series: 'outpost_monitor_heartbeat_received_timestamp_seconds{outpost_monitor="primary"}'
        values: "1000 1060 _ _ 1240 1500 1360"
    alert_rule_test:
      - eval_time: 0m
        alertname: OutpostMonitorHeartbeat
        exp_alerts:
          - exp_labels: { severity: heartbeat }
            exp_annotations: { runbook: monitoring }
      - eval_time: 2m
        alertname: OutpostMonitoringDeliveryMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: OutpostMonitoringDeliveryMissing
        exp_alerts:
          - exp_labels: { outpost_monitor: primary, severity: critical }
            exp_annotations: { runbook: monitoring }
      - eval_time: 4m
        alertname: OutpostMonitoringDeliveryMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: OutpostMonitoringDeliveryMissing
        exp_alerts:
          - exp_labels: { outpost_monitor: primary, severity: critical }
            exp_annotations: { runbook: monitoring }
      - eval_time: 6m
        alertname: OutpostMonitoringDeliveryMissing
        exp_alerts: []
