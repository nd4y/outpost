name: Documentation and adoption

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned dependencies
        run: npm ci --prefix .standards --ignore-scripts --no-audit --no-fund
      - name: Install checksum-verified scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install-ci-scanner.sh
      - name: Verify documentation and full formatting
        run: |
          node .standards/check.mjs structure
          node scripts/check-docs.mjs
          node scripts/check-test-links.mjs
          node scripts/check-format.mjs
      - name: Verify adoption rejection cases
        run: node scripts/check-standard-adoption.mjs
      - name: Verify monitoring and independent watchdog rules
        run: |
          image=prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
          timeout 60 docker pull "$image"
          timeout 40 docker run --rm --pull never --network none --cpus 1 --memory 256m \
            --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,source=$PWD/packaging/monitoring,target=/rules,readonly" --workdir /rules \
            --entrypoint /bin/promtool "$image" test rules rules.test.yml
