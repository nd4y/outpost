name: Native distribution checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      CGO_ENABLED: "0"
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Build selected artifacts and native synthetic fixture
        run: |
          python3 scripts/build-release.py --output "$RUNNER_TEMP/current" > "$RUNNER_TEMP/current-receipt.json"
          go test -c -trimpath -o "$RUNNER_TEMP/container-fixture.test" ./cmd/outpost
      - name: Build the documented previous implementation with the current packager
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir "$RUNNER_TEMP/previous-source"
          git archive 7747e0b7fd53b4cb4f78911eeb78053e2c58dad1 | tar -xf - -C "$RUNNER_TEMP/previous-source"
          cp scripts/build-release.py scripts/verify-release.py scripts/check-release.py "$RUNNER_TEMP/previous-source/scripts/"
          cp -R packaging "$RUNNER_TEMP/previous-source/packaging"
          python3 "$RUNNER_TEMP/previous-source/scripts/build-release.py" \
            --output "$RUNNER_TEMP/previous" --architecture "$ARCHITECTURE" > "$RUNNER_TEMP/previous-receipt.json"
      - name: Reject changed artifacts and execute native installation and recovery
        run: |
          current_hash=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/current-receipt.json"))["manifestSHA256"])')
          previous_hash=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/previous-receipt.json"))["manifestSHA256"])')
          python3 scripts/check-release.py --root "$RUNNER_TEMP/current" \
            --manifest-sha256 "$current_hash" --work "$RUNNER_TEMP/artifact-checks"
          python3 scripts/check-container.py --root "$RUNNER_TEMP/current" \
            --manifest-sha256 "$current_hash" --previous-root "$RUNNER_TEMP/previous" \
            --previous-manifest-sha256 "$previous_hash" --fixture-binary "$RUNNER_TEMP/container-fixture.test" \
            --work "$RUNNER_TEMP/container-checks"
